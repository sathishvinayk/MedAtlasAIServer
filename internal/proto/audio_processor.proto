syntax = "proto3";

package audio_processor;

service AudioProcessor {
    rpc ProcessAudioStream(stream AudioChunk) returns (stream ProcessingResult);
    rpc ProcessAudioBatch(AudioBatchRequest) returns (processingResultBatch);
}

message AudioBatchRequest {
  bytes audio_data = 1;
  string session_id = 2;
  int32 sample_rate = 3;
}

message AudioChunk {
    bytes audio_data = 1;
    string session_id = 2;
    int32 sample_rate = 3;
    int32 chunk_index = 4;
    bool is_final = 5;
}

message ProcessingResult {
    oneof result {
        TranscriptChunk transcript = 1;
        EntityUpdate entities = 2;
        SpeakerSegment speaker = 3;
        StatusUpdate status = 4;
        SoapNoteUpdate soap_note = 5;
    }
    string session_id = 6;
}

message ProcessingResultBatch {
  string transcript = 1;
  repeated MedicalEntity entities = 2;
  repeated SpeakerSegment speaker_segments = 3;
  string soap_note = 4;
  string model_used = 5;
  string status = 6;
}

message TranscriptChunk {
    string text = 1;
    bool is_partial = 2;
    int64 start_time_ms = 3;
    int64 end_time_ms = 4;
}

message SpeakerSegment {
    string speaker_id = 1;
    float start_time = 2;
    float end_time = 3;
    float confidence = 4;
}

message EntityUpdate {
    repeated MedicalEntity entities = 1;
}

message MedicalEntity {
    string entity_type = 1;
    string text = 2;
    int32 start = 3;
    int32 end = 4;
    float confidence = 5;
}

message StatusUpdate {
  string stage = 1;  // "transcribing", "diarizing", "processing"
  float progress = 2;
}

message SoapNoteUpdate {
  string section = 1;  // "subjective", "objective", "assessment", "plan"
  string content = 2;
  bool is_complete = 3;
}