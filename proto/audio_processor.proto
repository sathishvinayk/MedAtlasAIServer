syntax = "proto3";

package audio_processor;

option go_package = "./";

service AudioProcessor {
    rpc ProcessAudioStream(stream AudioChunk) returns (stream ProcessingResult);
}

message AudioChunk {
    bytes audio_data = 1;
    string session_id = 2;
    int32 sample_rate = 3;
    int32 chunk_index = 4;
    bool is_final = 5;
}

message ProcessingResult {
    oneof result {
        TranscriptChunk transcript = 1;
        SpeakerUpdate speaker = 2;
        EntityUpdate entities = 3;
        SoapNoteUpdate soap_note = 4;
    }
    string session_id = 6;
}

message TranscriptChunk {
    string text = 1;
    bool is_partial = 2;
    int64 start_time_ms = 3;
    int64 end_time_ms = 4;
}

message SpeakerUpdate {
    repeated SpeakerSegment segments = 1;
}

message SpeakerSegment {
    string speaker_id = 1;
    float start_time = 2;
    float end_time = 3;
    float confidence = 4;
}

message EntityUpdate {
    repeated MedicalEntity entities = 1;
}

message MedicalEntity {
    string entity_type = 1;
    string text = 2;
    int32 start = 3;
    int32 end = 4;
    float confidence = 5;
}

message SoapNoteUpdate {
    string content = 1;
    bool is_complete = 2;
}